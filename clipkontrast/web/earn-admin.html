<style>
:root{--brand:#C6F432;--brand-hi:#D4FA5A;--ink:#1A2100;--soft:#F5FDE0;--line-b:#E3F7A8;--deep:#4E6B00;

*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--text);font:14px/1.5 "Geist","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

button,input,select,textarea{font:inherit;color:inherit}
svg{width:17px;height:17px;flex:none;fill:currentColor}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--frame);color:var(--frame-text);padding:14px 10px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}

.ni{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--frame-text);font-weight:500;cursor:pointer;text-decoration:none;width:100%;text-align:left;transition:background-color .15s ease}
.ni:hover{background:var(--frame-2)}.ni.on{background:var(--frame-2);color:#fff}.ni.on svg{color:var(--brand)}
.ni svg{color:var(--frame-dim)}
.ni .cnt{margin-left:auto;font-size:12px;background:var(--brand);color:var(--ink);padding:0 7px;border-radius:999px;font-weight:600}
.side .foot{margin-top:auto;display:grid;gap:2px}
.main{background:#fff;min-width:0;border-radius:16px 0 0 16px;margin:8px 0;padding:0 0 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5;border-radius:16px 0 0 0}
.top h1{font-size:22px;letter-spacing:-.03em;font-weight:650}
.top p{color:var(--dim);font-size:13px}
.view{padding:24px 32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--ink)}.btn.primary:hover{background:var(--brand-hi)}
.btn.dark{background:var(--frame);border-color:var(--frame);color:#fff}.btn.dark:hover{background:#3A2C25}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}.btn.good:hover{background:#0b7449}
.btn.bad{color:var(--bad)}.btn.bad:hover{background:var(--bad-soft)}
.btn.xs{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.kpi span{color:var(--dim);font-size:13px}.kpi b{display:block;font-size:28px;letter-spacing:-.04em;font-weight:700;margin-top:2px}
.kpi.hi{background:var(--frame);border-color:var(--frame)}.kpi.hi span{color:var(--frame-dim)}.kpi.hi b{color:var(--brand)}
.card{border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-top:16px}
.card h3{font-size:16px;margin-bottom:12px}
.note{border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-top:16px}
.note.warn{background:var(--warn-soft);color:#6B4200}.note.info{background:var(--soft);color:var(--deep)}
.note .btn{margin-left:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--faint);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FCFBFA}
.tw{overflow-x:auto}
.meter{height:7px;border-radius:99px;background:var(--muted);overflow:hidden;width:120px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.live{background:var(--brand);color:var(--ink)}.chip.draft{background:var(--muted);color:var(--dim)}.chip.paused{background:var(--warn-soft);color:var(--warn)}.chip.ended{background:var(--frame);color:#fff}
.chip.pending{background:var(--warn-soft);color:var(--warn)}.chip.approved{background:var(--good-soft);color:var(--good)}.chip.rejected{background:var(--bad-soft);color:var(--bad)}.chip.paid{background:var(--frame);color:var(--brand)}
.chip.ready{background:var(--soft);color:var(--deep)}
.cks{display:flex;gap:4px;flex-wrap:wrap}
.cks span{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--muted);color:var(--dim);cursor:help}
.cks span.y{background:var(--good-soft);color:var(--good)}.cks span.n{background:var(--bad-soft);color:var(--bad)}
.who b{display:block;font-weight:600}.who small{color:var(--faint);display:block;font-size:12px}
.link a{font-weight:500;text-decoration:none;display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link a:hover{color:var(--deep)}
.link small{color:var(--faint);font-size:12px;display:block}
.vin{width:96px;height:30px;border:1px solid var(--line-2);border-radius:7px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.vin:focus{border-color:var(--brand);outline:0}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:0 12px;height:36px;cursor:pointer;font-weight:500;color:var(--dim);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--frame);color:#fff}
.seg .c{font-size:11px;opacity:.75;margin-left:4px}
.inp{height:36px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:#fff;outline:0}
.inp:focus{border-color:var(--brand)}
.bulk{position:sticky;bottom:16px;margin-top:14px;background:var(--frame);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center}
.bulk .btn{height:34px}

.modal-bg{position:fixed;inset:0;background:rgba(30,22,18,.5);z-index:50;display:flex;justify-content:flex-end}
.modal{width:min(780px,100%);height:100%;background:#fff;overflow-y:auto}

.sect:first-child{margin-top:0}
.field{margin-bottom:12px}

.checks input{accent-color:var(--deep)}
.preview{background:var(--soft);border-radius:10px;padding:12px 14px;color:var(--deep);font-size:13px}
.cover-prev{width:100%;aspect-ratio:16/7;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--muted);display:block}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--frame);color:#fff;padding:11px 16px;border-radius:10px;z-index:99;max-width:90vw}
.toast.bad{background:var(--bad)}.toast.good{background:var(--good)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:40px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
code{background:var(--muted);padding:1px 6px;border-radius:5px;font-size:13px}
ol.steps{padding-left:18px;color:var(--dim);display:grid;gap:6px;margin:10px 0 0}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px}.side img,.side h4,.side .foot{display:none}.ni{width:auto}.main{border-radius:0;margin:0}.kpis{grid-template-columns:1fr 1fr}.view,.top{padding-left:16px;padding-right:16px}.g3,.g2{grid-template-columns:1fr}}

  const pend = S.sum?.pending, owedN = S.sum?.owed_people;
  $("#nav").innerHTML = Object.entries(TABS).map(([k, [l, i]]) => `<a class="ni ${S.tab === k ? "on" : ""}" href="/admin/earn/${k}" data-tab="${k}">${ic(i)}${l}${k === "review" && pend ? `<span class="cnt">${pend}</span>` : ""}${k === "payouts" && owedN ? `<span class="cnt">${owedN}</span>` : ""}</a>`).join("");
  const [t, , sub] = TABS[S.tab]; $("#title").textContent = t; $("#subtitle").textContent = sub;
  $("#actions").innerHTML = S.tab === "campaigns" || S.tab === "overview" ? `<button class="btn primary" data-act="new">+ New campaign</button>` :
    S.tab === "review" ? `<button class="btn" data-act="yt-refresh">Refresh YouTube views</button>` :
    S.tab === "payouts" ? `<a class="btn" href="/api/admin/earn/owed.csv">Download CSV</a>` : "";
}
const chip = s => `<span class="chip ${esc(s)}">${esc(s[0].toUpperCase() + s.slice(1))}</span>`;

// ---------------------------------------------------------------- overview
function drawOverview() {
  const s = S.sum, o = s.overview;
  return `${!s.settings.youtube_ready ? `<div class="note warn" style="margin:0 0 16px">No YouTube API key yet, so YouTube views have to be typed in by hand. Adding a key takes 2 minutes.<button class="btn" data-tab="settings">Add key</button></div>` : ""}
    <div class="kpis"><div class="kpi hi"><span>Waiting for review</span><b>${num(s.pending)}</b></div><div class="kpi"><span>Owed to clippers</span><b>${inr(s.owed_total)}</b></div>
      <div class="kpi"><span>Paid out, all time</span><b>${inr(o.paid_out)}</b></div><div class="kpi"><span>Open budget</span><b>${inr(o.live_budget)}</b></div></div>
    <div class="card"><h3>Campaigns</h3>${campTable(S.camps.slice(0, 6))}</div>
    <div class="card"><h3>Clips by status</h3><div class="kpis">${["pending", "approved", "paid", "rejected"].map(k => `<div class="kpi"><span>${chip(k)}</span><b>${num(s.counts[k])}</b></div>`).join("")}</div></div>`;
}

// ---------------------------------------------------------------- campaigns
function campTable(cs) {
  if (!cs.length) return `<div class="empty"><b>No campaigns yet</b>Create one, set the budget and rate, and go live.</div>`;
  return `<div class="tw"><table><thead><tr><th>Campaign</th><th>Status</th><th>Rate</th><th>Budget used</th><th>Clippers</th><th>Clips</th><th>To review</th><th></th></tr></thead><tbody>
    ${cs.map(c => `<tr><td><b>${esc(c.title)}</b><div style="color:var(--faint);font-size:12px">${esc(c.creator_name)} · /earn#c=${esc(c.slug)}</div></td>
      <td>${chip(c.status)}${c.status === "live" && !c.open ? ' <span style="color:var(--faint);font-size:12px">not open</span>' : ""}</td>
      <td class="num">${inr(c.rate_per_1k)}/1K</td>
      <td><div class="meter"><i style="width:${c.used_pct}%"></i></div><div style="font-size:12px;color:var(--dim)">${inr(c.committed)} of ${inr(c.budget)}</div></td>
      <td class="num">${num(c.clippers)}</td><td class="num">${num(c.clips)}</td>
      <td>${c.pending ? `<button class="btn xs" data-act="review-camp" data-id="${esc(c.id)}">${c.pending} to review</button>` : "—"}</td>
      <td><div style="display:flex;gap:6px;justify-content:flex-end">
        ${c.status !== "live" ? `<button class="btn xs primary" data-act="status" data-id="${esc(c.id)}" data-s="live">Go live</button>` : `<button class="btn xs" data-act="status" data-id="${esc(c.id)}" data-s="paused">Pause</button>`}
        ${c.status !== "ended" ? `<button class="btn xs" data-act="status" data-id="${esc(c.id)}" data-s="ended">End</button>` : ""}
        <button class="btn xs" data-act="edit" data-id="${esc(c.id)}">Edit</button>
        <a class="btn xs" href="/earn#c=${esc(c.slug)}" target="_blank">View</a></div></td></tr>`).join("")}</tbody></table></div>`;
}
const drawCampaigns = () => `<div class="card" style="margin-top:0">${campTable(S.camps)}</div>`;

function toLocalInput(t) { if (!t) return ""; const d = new Date(t * 1000); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
function openForm(c) {
  c = c || {title: "", creator_name: "", creator_url: "", tagline: "", category: "Gaming", brief: "", raw_rules: "Hook the viewer in the first 2 seconds, with text on screen\nBurned-in captions, readable on a phone\nCredit the creator and link their channel in the caption\nNo in-game radio or copyrighted music\nNo big story spoilers in the hook or thumbnail\nNo botted or bought views",
    raw_sources: "", platforms: ["youtube", "instagram", "x"], required_tag: "", rate_per_1k: 20, min_views: 1000, max_per_clip: 0, budget: 45000, hold_days: 7, status: "draft", starts_at: null, ends_at: null, accent: "#C6F432"};

  $("#modal").innerHTML = `<div class="modal-bg" data-act="close-bg"><div class="modal"><div class="mh"><h3 style="font-size:18px">${c.id ? "Edit campaign" : "New campaign"}</h3><div style="display:flex;gap:8px">

      <div class="sect">The campaign</div>
      <div class="g2"><div class="field"><label>Campaign name *</label><input name="title" value="${esc(c.title)}" placeholder="GTA 6 Launch" required></div>
        <div class="field"><label>Creator or brand</label><input name="creator_name" value="${esc(c.creator_name)}" placeholder="Creator name"></div></div>
      <div class="g2"><div class="field"><label>Creator's channel link</label><input name="creator_url" value="${esc(c.creator_url)}" placeholder="https://youtube.com/@creator"></div>
        <div class="field"><label>Category</label><input name="category" value="${esc(c.category)}" placeholder="Gaming"></div></div>
      <div class="field"><label>One-line pitch</label><input name="tagline" value="${esc(c.tagline)}" maxlength="200" placeholder="Live-clip the GTA 6 launch streams and get paid per view"></div>
      <div class="field"><label>Brief</label><textarea name="brief" rows="5" placeholder="What to clip, what kind of moments work, tone, language…">${esc(c.brief)}</textarea></div>
      <div class="g2"><div class="field"><label>Rules (one per line)</label><textarea name="rules" rows="7">${esc(c.raw_rules ?? (c.rules || []).join("\n"))}</textarea></div>
        <div class="field"><label>Streams and footage (one link per line)</label><textarea name="sources" rows="7" placeholder="https://youtube.com/@creator/streams&#10;https://drive.google.com/…">${esc(c.raw_sources ?? (c.sources || []).join("\n"))}</textarea><div class="hint">Only clippers who joined can see these.</div></div></div>
      <div class="sect">Where and how clips are checked</div>
      <div class="field"><label>Platforms that pay</label><div class="checks">${Object.entries(PLAT).map(([k, l]) => `<label><input type="checkbox" name="platforms" value="${k}" ${pl.has(k) ? "checked" : ""}>${l}</label>`).join("")}</div></div>
      <div class="g2"><div class="field"><label>Required in the caption</label><input name="required_tag" value="${esc(c.required_tag)}" placeholder="@creatorhandle"><div class="hint">Checked automatically on YouTube.</div></div>
        <div class="field"><label>Days before views are counted</label><input name="hold_days" type="number" min="0" max="60" value="${c.hold_days}"></div></div>
      <div class="sect">Money</div>
      <div class="g2"><div class="field"><label>Total budget for clippers (₹) *</label><input name="budget" type="number" min="0" step="1" value="${c.budget}"></div>
        <div class="field"><label>Rate per 1,000 views (₹) *</label><input name="rate_per_1k" type="number" min="0" step="0.5" value="${c.rate_per_1k}"></div></div>
      <div class="g2"><div class="field"><label>Minimum views for a clip to earn</label><input name="min_views" type="number" min="0" value="${c.min_views}"></div>
        <div class="field"><label>Most one clip can earn (₹, 0 = no limit)</label><input name="max_per_clip" type="number" min="0" value="${c.max_per_clip}"></div></div>
      <div class="preview" id="mathPrev"></div>
      <div class="sect">Dates and look</div>
      <div class="g3"><div class="field"><label>Starts</label><input name="starts_at" type="datetime-local" value="${toLocalInput(c.starts_at)}"></div>
        <div class="field"><label>Ends</label><input name="ends_at" type="datetime-local" value="${toLocalInput(c.ends_at)}"></div>
        <div class="field"><label>Status</label><select name="status">${["draft", "live", "paused", "ended"].map(s => `<option ${c.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div></div>
      <div class="g2"><div class="field"><label>Accent colour (used when there's no cover)</label><input name="accent" type="color" value="${esc(c.accent)}" style="padding:4px;height:40px"></div>
        <div class="field"><label>Cover image (16:9)</label>${c.id ? `<input type="file" accept="image/png,image/jpeg,image/webp" data-cover="${esc(c.id)}" style="padding-top:8px">` : `<div class="hint" style="margin-top:12px">Save the campaign first, then add a cover.</div>`}</div></div>

    </form></div></div>`;
  mathPreview();
}
function mathPreview() {
  const f = $("#cf"); if (!f) return;
  const b = +f.budget.value || 0, r = +f.rate_per_1k.value || 0, cap = +f.max_per_clip.value || 0;
  $("#mathPrev").innerHTML = r ? `This budget pays for about <b>${num(Math.round(b / r * 1000))}</b> views. A clip with 50,000 views earns <b>${inr(Math.min(50 * r, cap || 1e12))}</b>. The campaign closes by itself when the budget is used up.` : "Set a rate to see what the budget buys.";
}

// ---------------------------------------------------------------- review
function checkChips(c) {
  const t = s => esc(s || "");
  const one = (v, y, n, q, tip) => v === true ? `<span class="y" title="${t(tip)}">✓ ${y}</span>` : v === false ? `<span class="n" title="${t(tip)}">✕ ${n}</span>` : q ? `<span title="${t(tip)}">? ${q}</span>` : "";
  return `<div class="cks">${one(c.owner, "Owner", "Owner", "Owner", c.owner_detail)}${one(c.after_start, "On time", "Early", "", "")}${one(c.tag, "Tag", "No tag", "", "")}</div>${c.title ? `<div style="font-size:12px;color:var(--faint);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t(c.title)}">${t(c.title)}</div>` : ""}`;
}
function drawReview() {
  const q = S.queue; if (!q) return "Loading…";
  const c = q.counts;
  return `<div class="filters">
      <div class="seg">${["pending", "approved", "paid", "rejected", "all"].map(s => `<button class="${S.qStatus === s ? "on" : ""}" data-act="qstatus" data-s="${s}">${s[0].toUpperCase() + s.slice(1)}${c[s] !== undefined ? `<span class="c">${c[s]}</span>` : ""}</button>`).join("")}</div>
      <select class="inp" data-act="qcamp"><option value="">All campaigns</option>${S.camps.map(x => `<option value="${esc(x.id)}" ${S.qCamp === x.id ? "selected" : ""}>${esc(x.title)}</option>`).join("")}</select>
      <input class="inp" id="qsearch" placeholder="Search clipper or link" value="${esc(S.q)}" style="min-width:220px">
    </div>
    ${q.items.length ? `<div class="tw"><table><thead><tr><th><input type="checkbox" data-act="selall"></th><th>Clipper</th><th>Clip</th><th>Cross-check</th><th>Views</th><th>Earns</th><th>Proof</th><th>Status</th><th></th></tr></thead><tbody>
      ${q.items.map(s => `<tr>
        <td>${["pending"].includes(s.status) ? `<input type="checkbox" data-sel="${s.id}" ${S.sel.has(s.id) ? "checked" : ""}>` : ""}</td>
        <td class="who"><b>${esc(s.clipper.name || s.clipper.email.split("@")[0])}</b><small>${esc(s.clipper.email)}</small><small>${esc(s.clipper.handle)} · ${s.clipper.whatsapp ? `<a href="https://wa.me/${esc(s.clipper.whatsapp.replace(/\D/g, ""))}" target="_blank" rel="noopener">${esc(s.clipper.whatsapp)}</a>` : "no WhatsApp"}</small></td>
        <td class="link"><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(PLAT[s.platform])} ↗ ${esc(s.url.replace(/^https?:\/\/(www\.)?/, ""))}</a><small>${esc(s.campaign)} · sent ${esc(ago(s.submitted_at))}${s.posted_at ? " · posted " + esc(date(s.posted_at)) : ""}</small>${s.note ? `<small style="color:var(--dim)">“${esc(s.note)}”</small>` : ""}</td>
        <td>${checkChips(s.checks)}</td>
        <td>${s.status === "pending" ? `<input class="vin" type="number" min="0" value="${s.views}" data-views="${s.id}">` : `<span class="num">${num(s.views)}</span>`}<div style="font-size:11px;color:var(--faint)">${s.views_source === "api" ? "from YouTube " + esc(ago(s.views_at)) : s.views_source === "manual" ? "typed in" : "not counted yet"}</div></td>
        <td class="num">${s.status === "approved" || s.status === "paid" ? inr(s.amount) : "~" + inr(s.estimate)}</td>
        <td>${s.has_proof ? `<a href="/api/earn/proof/${s.id}" target="_blank"><img class="thumb" src="/api/earn/proof/${s.id}" alt="proof" loading="lazy"></a>` : `<span style="color:var(--faint);font-size:12px">${s.platform === "youtube" ? "not needed" : "none yet"}</span>`}</td>
        <td>${s.status === "pending" ? (s.ready ? '<span class="chip ready">Ready</span>' : `<span class="chip pending" title="Views are counted ${esc(date(s.ready_at))}">Holding</span>`) : chip(s.status)}${s.review_note ? `<div style="font-size:11px;color:var(--faint);max-width:160px">${esc(s.review_note)}</div>` : ""}</td>
        <td><div style="display:flex;gap:6px;justify-content:flex-end">${s.status === "pending" ? `<button class="btn xs good" data-act="approve" data-id="${s.id}">Approve</button><button class="btn xs bad" data-act="reject" data-id="${s.id}">Reject</button>`
          : s.status !== "paid" ? `<button class="btn xs" data-act="reopen" data-id="${s.id}">Back to review</button>` : ""}</div></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><b>Nothing here</b>${S.qStatus === "pending" ? "No clips are waiting for review." : "No clips match."}</div>`}
    ${S.sel.size ? `<div class="bulk"><b>${S.sel.size} selected</b><span style="color:var(--frame-dim);font-size:13px">Approves with the views shown in each row</span><span style="flex:1"></span><button class="btn good" data-act="bulk-approve">Approve selected</button><button class="btn" data-act="bulk-reject">Reject selected</button><button class="btn" data-act="clear-sel">Clear</button></div>` : ""}`;
}

  return `<div class="card" style="margin-top:0;max-width:720px"><h3>YouTube API key</h3>

// ---------------------------------------------------------------- drawing and loading
function draw() {
  nav();
  $("#view").innerHTML = !S.sum ? "Loading…" : {overview: drawOverview, campaigns: drawCampaigns, review: drawReview, payouts: drawPayouts, settings: drawSettings}[S.tab]();
}
async function loadQueue() { S.queue = await api(`/api/admin/earn/submissions?status=${S.qStatus === "all" ? "" : S.qStatus}&campaign=${encodeURIComponent(S.qCamp)}&q=${encodeURIComponent(S.q)}`); }
async function load() {
  [S.sum, S.camps] = await Promise.all([api("/api/admin/earn/summary"), api("/api/admin/earn/campaigns")]);
  if (S.tab === "review") await loadQueue();
  if (S.tab === "payouts") S.owed = await api("/api/admin/earn/owed");
  if (S.tab === "settings") { try { S.mail = (await api("/api/public")).mail; } catch {} }
  draw();
}
function go(tab) { S.tab = tab; S.sel.clear(); history.pushState(null, "", "/admin/earn/" + tab); draw(); load().catch(e => toast(e.message, "bad")); }
addEventListener("popstate", () => { S.tab = location.pathname.split("/")[3] || "overview"; load(); });

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab]"); if (t) { e.preventDefault(); go(t.dataset.tab); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  try {
    if (act === "new") openForm();
    else if (act === "edit") openForm(S.camps.find(c => c.id === id));
    else if (act === "close" || (act === "close-bg" && e.target === a)) $("#modal").innerHTML = "";
    else if (act === "status") { await api("/api/admin/earn/campaigns/" + id, {method: "PUT", body: {status: a.dataset.s}}); toast("Campaign is now " + a.dataset.s + ".", "good"); await load(); }
    else if (act === "delete") { if (!confirm("Delete this campaign and every clip sent to it? This can't be undone.")) return; await api("/api/admin/earn/campaigns/" + id, {method: "DELETE"}); $("#modal").innerHTML = ""; toast("Deleted."); await load(); }
    else if (act === "review-camp") { S.qCamp = id; S.qStatus = "pending"; go("review"); }
    else if (act === "qstatus") { S.qStatus = a.dataset.s; S.sel.clear(); await loadQueue(); draw(); }
    else if (act === "approve" || act === "reject" || act === "reopen") {
      let note = "";
      if (act === "reject") { note = prompt("Why isn't it approved? The clipper sees this.", "Doesn't follow the campaign rules."); if (note === null) return; }
      const vin = $(`[data-views="${id}"]`), body = {action: act, note};
      if (vin && act === "approve") body.views = vin.value;
      const r = await api("/api/admin/earn/submissions/" + id, {method: "POST", body});
      toast(act === "approve" ? `Approved: ${inr(r.amount)}` : act === "reject" ? "Rejected." : "Back in review.", act === "approve" ? "good" : "");
      S.sel.delete(+id); await load();
    }
    else if (act === "bulk-approve" || act === "bulk-reject") {
      let note = "";
      if (act === "bulk-reject") { note = prompt("Reason shown to the clippers:", "Doesn't follow the campaign rules."); if (note === null) return; }
      for (const sid of S.sel) { const v = $(`[data-views="${sid}"]`); if (v) await api(`/api/admin/earn/submissions/${sid}/views`, {method: "POST", body: {views: v.value}}); }
      const r = await api("/api/admin/earn/submissions/bulk", {method: "POST", body: {ids: [...S.sel], action: act === "bulk-approve" ? "approve" : "reject", note}});
      toast(`${r.done} done${r.problems.length ? ". " + r.problems[0] : ""}`, r.problems.length ? "bad" : "good"); S.sel.clear(); await load();
    }
    else if (act === "clear-sel") { S.sel.clear(); draw(); }
    else if (act === "selall") { S.queue.items.filter(s => s.status === "pending").forEach(s => a.checked ? S.sel.add(s.id) : S.sel.delete(s.id)); draw(); }
    else if (act === "yt-refresh") { const r = await api("/api/admin/earn/refresh", {method: "POST", body: {}}); toast(`${r.updated} YouTube clips updated.`, "good"); await load(); }
    else if (act === "copy") { await navigator.clipboard.writeText(a.dataset.v); toast("UPI ID copied."); }
    else if (act === "pay") {
      const ref = prompt(`Send ${inr(+a.dataset.amt)} to ${a.dataset.name} from your UPI app first.\n\nThen paste the UTR / transaction reference here:`);
      if (ref === null) return;
      const r = await api("/api/admin/earn/payouts", {method: "POST", body: {user_id: id, ref}}); toast(`Recorded ${inr(r.amount)} for ${r.clips} clips.`, "good"); await load();
    }
    else if (act === "yt-clear") { await api("/api/admin/earn/settings", {method: "PUT", body: {youtube_key: ""}}); toast("Key removed."); await load(); }
  } catch (err) { toast(err.message, "bad"); }
});
document.addEventListener("change", async e => {
  if (e.target.dataset.sel) { e.target.checked ? S.sel.add(+e.target.dataset.sel) : S.sel.delete(+e.target.dataset.sel); draw(); return; }
  if (e.target.dataset.act === "qcamp") { S.qCamp = e.target.value; await loadQueue(); draw(); return; }
  if (e.target.dataset.views) {
    try { await api(`/api/admin/earn/submissions/${e.target.dataset.views}/views`, {method: "POST", body: {views: e.target.value}}); toast("Views saved."); await loadQueue(); draw(); } catch (err) { toast(err.message, "bad"); }
    return;
  }
  if (e.target.dataset.cover && e.target.files[0]) {
    const fd = new FormData(); fd.append("file", e.target.files[0]);
    try { const c = await api(`/api/admin/earn/campaigns/${e.target.dataset.cover}/cover`, {method: "POST", body: fd}); toast("Cover saved.", "good"); await load(); openForm(S.camps.find(x => x.id === c.id)); } catch (err) { toast(err.message, "bad"); }
  }
});
document.addEventListener("input", e => {
  if (e.target.closest("#cf")) mathPreview();
  if (e.target.id === "qsearch") { clearTimeout(S.qt); S.q = e.target.value; S.qt = setTimeout(async () => { await loadQueue(); draw(); const i = $("#qsearch"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 350); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  try {
    if (f.id === "cf") {
      const d = Object.fromEntries(new FormData(f).entries());
      d.platforms = $$('input[name="platforms"]:checked', f).map(x => x.value);
      d.starts_at = d.starts_at ? new Date(d.starts_at).getTime() / 1000 : null;
      d.ends_at = d.ends_at ? new Date(d.ends_at).getTime() / 1000 : null;
      const c = await api("/api/admin/earn/campaigns" + (f.dataset.id ? "/" + f.dataset.id : ""), {method: f.dataset.id ? "PUT" : "POST", body: d});
      toast(f.dataset.id ? "Saved." : "Campaign created. Add a cover, then go live.", "good");
      await load();
      if (!f.dataset.id) openForm(S.camps.find(x => x.id === c.id)); else $("#modal").innerHTML = "";
    }
    if (f.id === "ytf") { await api("/api/admin/earn/settings", {method: "PUT", body: {youtube_key: f.key.value}}); toast("Key works and is saved.", "good"); await load(); }
  } catch (err) { toast(err.message, "bad"); }
});
draw();
load().catch(e => toast(e.message, "bad"));
</script>
</body>
</html>
